# -*- coding: utf-8 -*-
# mamba_unet/configs/default.yaml - Cấu hình mặc định cho kiến trúc Mamba-UNet

model:
  backbone: "mamba_vision_T"
  pretrained: true
  activation: "relu"
  classes: 1
  in_channels: 3
  final_channels: 32
  init_bias: -4.0

data:
  cache_dir: "data/cache_1mm"
  image_size: 512
  workers: 2
  augment: true
  lung_mask: true
  gpu_window: false

loss:
  name: "dice_bce"
  params:
    bce_weight: 0.5
    dice_weight: 0.5
    smooth: 1.0
    batch_dice: true

training:
  epochs: 50
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  freeze_backbone_epochs: 5
  backbone_lr_mult: 0.1
  scheduler: "cosine"
  grad_clip: 1.0
  patience: 12
  seed: 42
